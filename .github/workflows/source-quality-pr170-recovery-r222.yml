name: PR 170 development stack exact-source validation

on:
  push:
    branches: [codex/source-quality-pr170-recovery-r222]
    paths: [.github/workflows/source-quality-pr170-recovery-r222.yml]

permissions:
  contents: read

concurrency:
  group: source-quality-pr170-recovery-r222
  cancel-in-progress: false

jobs:
  full-stack:
    # Standard public runners only. No private, self-hosted, larger or paid fallback.
    if: github.repository == 'pythonyx135793/spaceapp' && github.event.repository.private == false && github.ref == 'refs/heads/codex/source-quality-pr170-recovery-r222'
    name: Real source stack / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      SPACE_DEV_REDACT_SETUP: "true"
      SPACE_DEV_CANDIDATE: 7af5b2b6876b75ef4828718b0ea5c58976036993
      EXPECTED_SOURCE: 7af5b2b6876b75ef4828718b0ea5c58976036993
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7af5b2b6876b75ef4828718b0ea5c58976036993
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify exact public candidate
        run: |
          printf 'SPACE_DEV_PROOF_DIR=%s/spaceapp-dev-stack-proof\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, realpathSync } from 'node:fs';
          assert.match(process.env.SPACE_DEV_CANDIDATE, /^[a-f0-9]{40}$/);
          const actual = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          assert.equal(actual, process.env.SPACE_DEV_CANDIDATE);
          const tree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], {encoding:'utf8'}).trim();
          assert.equal(tree, 'b243b5d59ec4bd9d2aab561a6046b9e1e9ae94e9');
          assert.equal(execFileSync('git', ['status', '--porcelain', '--untracked-files=all'], {encoding:'utf8'}).trim(), '');
          if (process.env.EXPECTED_SOURCE) {
            assert.match(process.env.EXPECTED_SOURCE, /^[a-f0-9]{40}$/);
            assert.equal(actual, process.env.EXPECTED_SOURCE);
          }
          appendFileSync(process.env.GITHUB_ENV, `TMPDIR=${realpathSync(process.env.RUNNER_TEMP)}\n`);
          console.log(`Exact source ${actual}; Node ${process.version}; ${process.platform}/${process.arch}`);
          NODE
          git diff --exit-code

      - name: Prepare ephemeral Intel-macOS Docker
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = x86_64
          brew install colima docker docker-compose ripgrep
          mkdir -p "$HOME/.docker/cli-plugins"
          ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
          colima start --profile spaceapp-dev-proof --cpu 3 --memory 6 --disk 30
          docker context use colima-spaceapp-dev-proof

      - name: Prepare hosted Linux test prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ffmpeg

      - name: Verify existing Docker, Compose, browser and search tools
        run: |
          docker version
          docker compose version
          command -v rg
          if [[ "$RUNNER_OS" == macOS ]]; then
            test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          else
            test -x /usr/bin/google-chrome
            test -x /usr/bin/ffmpeg
          fi

      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Early actual pinned CLI and zero-provider PTY capability
        run: node scripts/dev-stack/capability-proof.mjs

      - name: Daemon-free isolation and cleanup regressions
        run: npm run test:dev-stack

      - name: Full stock check
        run: npm run check

      - name: Full stock tests (Linux reference platform)
        if: runner.os == 'Linux'
        run: npm test

      - name: Native macOS private-instance regressions
        if: runner.os == 'macOS'
        run: >-
          node node_modules/vitest/vitest.mjs run --config apps/api/vitest.config.ts
          apps/api/tests/instance-storage.test.ts apps/api/tests/dev-oauth-storage.test.ts
          apps/api/tests/dev-docx-isolation.test.ts apps/api/tests/dev-incidents-storage.test.ts
          apps/api/tests/space-control-governance.test.ts
          apps/api/tests/room-pane-worktrees.test.ts

      - name: Native macOS CLI host regressions
        if: runner.os == 'macOS'
        run: npm test --workspace @space/cli-host

      - name: Full stock build
        run: npm run build

      - name: Full stock hygiene
        run: npm run hygiene:preflight

      - name: Real HTTP, owner, browser, PTY, HMR, isolation and failure cleanup
        run: node scripts/dev-stack/lifecycle-proof.mjs

      - name: Final clean exact-source guard
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$SPACE_DEV_CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = 'b243b5d59ec4bd9d2aab561a6046b9e1e9ae94e9'
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Remove ephemeral hosted Colima profile
        if: always() && runner.os == 'macOS'
        run: |
          if colima status --profile spaceapp-dev-proof >/dev/null 2>&1; then
            colima stop --profile spaceapp-dev-proof
          fi
          if colima list --json | grep -q 'spaceapp-dev-proof'; then
            colima delete --profile spaceapp-dev-proof --force
          fi

      - name: Preserve redacted evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-stack-${{ matrix.os }}-7af5b2b6876b75ef4828718b0ea5c58976036993
          path: ${{ runner.temp }}/spaceapp-dev-stack-proof
          if-no-files-found: warn
          retention-days: 7

      - name: Validation scope and source
        if: always()
        run: |
          printf 'Application source: 7af5b2b6876b75ef4828718b0ea5c58976036993. Scope: Linux full check/tests/build/hygiene, macOS check/build and native regressions, real development-stack lifecycle on both platforms. See step results and logs for failures and skipped tests. The existing web CI retry setting is unchanged. Earlier results remain separate evidence.\n' >> "$GITHUB_STEP_SUMMARY"
