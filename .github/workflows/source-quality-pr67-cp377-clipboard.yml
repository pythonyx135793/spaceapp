name: PR 67 clipboard lifecycle validation

on:
  push:
    branches:
      - codex/source-quality-pr67-cp377-clipboard
    paths:
      - .github/workflows/source-quality-pr67-cp377-clipboard.yml

permissions:
  contents: read

concurrency:
  group: source-quality-pr67-cp377-clipboard
  cancel-in-progress: false

jobs:
  current-main-validation:
    if: >-
      github.repository == 'pythonyx135793/spaceapp' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/source-quality-pr67-cp377-clipboard'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NO_COLOR: '1'
    steps:
      - name: Check out exact reviewed clipboard candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pythonyx135793/spaceapp
          ref: 0d92bc91e622697fca963e87afb8d1979dd5367f
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable clean source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '0d92bc91e622697fca963e87afb8d1979dd5367f'
          test "$(git rev-parse HEAD:apps/web/src/features/clipboard-dock/ClipboardDock.tsx)" = 'fc3085a7060bf405eccc4302bcc30f847add2000'
          test "$(git rev-parse HEAD:apps/web/tests/clipboard-dock.test.tsx)" = '3ba95e44125752a99777ef1d81e10b5b29b51c3a'
          test "$(git rev-parse HEAD:packages/codex-app-server/src/socket-path-recovery.ts)" = '95441af3378a2a94da9e1ebe747aaeb975303b60'
          test -z "$(git status --porcelain)"

      - name: Use source-required Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Verify environment and required tooling
        shell: bash
        run: |
          test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)"
          test "$(npm --version)" = '10.9.8'
          printf 'ImageOS=%s ImageVersion=%s CI=%s\n' "$ImageOS" "$ImageVersion" "$CI"
          uname -a
          node --version
          npm --version
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ripgrep
          fi
          rg --version
          printf 'One workflow and one full-root invocation; no added retries or assertion/timeout changes. Stock upstream web CI retry=2 remains configured, including in the controlled negative invocation.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Prove clipboard lifecycle tests reject the original component
        shell: bash
        run: |
          path=apps/web/src/features/clipboard-dock/ClipboardDock.tsx
          trap 'git restore --source=HEAD -- "$path"' EXIT
          git fetch --no-tags --depth=1 origin bbc656d83ef9c924f842578a2b02be575ee65cc6
          git show bbc656d83ef9c924f842578a2b02be575ee65cc6:"$path" > "$path"
          test "$(git hash-object "$path")" = '23d09f207b9d338e06b21f47ffb977e08306b5d4'
          test "$(git diff --name-only)" = "$path"
          set +e
          npm test -w @space/web -- tests/clipboard-dock.test.tsx -t 'copy feedback' --reporter=json --outputFile="$RUNNER_TEMP/clipboard-baseline.json"
          baseline_status=$?
          set -e
          test "$baseline_status" -ne 0
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'clipboard-baseline.json').read_text())
          assert result['numFailedTests'] == 3, result
          assert result['numPassedTests'] == 1, result
          tests = [test for file in result['testResults'] for test in file['assertionResults']]
          failed = {test['title']: test for test in tests if test['status'] == 'failed'}
          names = {
              'disposes copy feedback when the dock unmounts',
              'does not start copy feedback after a pending clipboard write outlives the dock',
              'restarts copy feedback without leaving the previous timer behind'}
          assert set(failed) == names, failed
          for name in names - {'restarts copy feedback without leaving the previous timer behind'}:
              assert 'expected 1 to be +0' in '\n'.join(failed[name]['failureMessages'])
          repeated = failed['restarts copy feedback without leaving the previous timer behind']
          assert 'Unable to find an element with the text: Copied' in '\n'.join(repeated['failureMessages'])
          print('Expected negative control: three lifecycle regressions fail; unchanged1500ms feedback duration passes.')
          PY
          git restore --source=HEAD -- "$path"
          trap - EXIT
          test "$(git rev-parse HEAD)" = '0d92bc91e622697fca963e87afb8d1979dd5367f'
          test -z "$(git status --porcelain)"

      - name: Four focused clipboard lifecycle regressions on exact candidate
        run: npm test -w @space/web -- tests/clipboard-dock.test.tsx -t 'copy feedback'

      - name: Full check
        id: check
        run: npm run check

      - name: One full-root test invocation on exact candidate
        id: test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-root-test.log"

      - name: Confirm sandbox duration from the full-root run
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'full-root-test.log').read_text()
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          matches = re.findall(r'tests/temporal-sandbox.integration.test\.ts \(23 tests\)\s+(\d+)ms', text)
          assert len(matches) == 1, matches
          milliseconds = int(matches[0])
          assert milliseconds < 180000, milliseconds
          summary = f'Exact candidate full-root run: sandbox/replay23 passed in {milliseconds}ms (file wall time).\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as file:
              file.write(summary)
          PY

      - name: Full build
        id: build
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: npm run build

      - name: Hygiene and immutable-source readback
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          npm run hygiene:preflight
          test "$(git rev-parse HEAD)" = '0d92bc91e622697fca963e87afb8d1979dd5367f'
          test -z "$(git status --porcelain)"
          git diff --check
          printf 'One root invocation; no added retry/assertion/timeout changes. Stock web CI retries remain configured. Historical failures remain preserved, including the unresolved original socket-hook timeout.\n' >> "$GITHUB_STEP_SUMMARY"
