name: PR 71 current-main validation

on:
  push:
    branches: [codex/source-quality-pr71-cp377]
    paths: [.github/workflows/source-quality-pr71-cp377.yml]

permissions:
  contents: read

concurrency:
  group: source-quality-pr71-cp377
  cancel-in-progress: false

jobs:
  current-main-validation:
    if: >-
      github.repository == 'pythonyx135793/spaceapp' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/source-quality-pr71-cp377'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NO_COLOR: '1'
    steps:
      - name: Check out exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pythonyx135793/spaceapp
          ref: 299b2261982f347147c25f378c7b1b8b05d39914
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable clean source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '299b2261982f347147c25f378c7b1b8b05d39914'
          test "$(git rev-parse HEAD:packages/runtime/src/otlp-span-exporter.ts)" = 'd24a1f874e3750dea604c61d7c75bb5f6e3183a3'
          test "$(git rev-parse HEAD:packages/observability/src/otlp-span-exporter.ts)" = '27ba790be634cd27ad37caedaae688fe3d967adf'
          test "$(git rev-parse HEAD:apps/worker/src/worker-tracing.ts)" = '5ecbdace66f63e81811f554ef6532ad0220c5f04'
          test "$(git rev-parse HEAD:apps/web/src/features/clipboard-dock/ClipboardDock.tsx)" = 'fc3085a7060bf405eccc4302bcc30f847add2000'
          test -z "$(git status --porcelain)"

      - name: Use source-required Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Verify environment and required tooling
        shell: bash
        run: |
          test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)"
          test "$(npm --version)" = '10.9.8'
          printf 'ImageOS=%s ImageVersion=%s CI=%s\n' "$ImageOS" "$ImageVersion" "$CI"
          uname -a
          node --version
          npm --version
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ripgrep
          fi
          rg --version

      - name: Install locked dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Full check
        id: check
        run: npm run check

      - name: Focused ClipboardDock timer lifecycle regressions
        run: npm test -w @space/web -- tests/clipboard-dock.test.tsx -t 'copy feedback'

      - name: Shared transport and runtime compatibility regressions
        run: |
          npm test -w @space/observability
          npm test -w @space/runtime -- tests/otlp-span-exporter.test.ts

      - name: Worker tracing and real Temporal collector integration
        run: >-
          npm test -w @space/worker --
          tests/activity-observability.test.ts
          tests/worker-tracing-host.test.ts
          tests/workflow-tracing.test.ts
          tests/workflow-tracing-protocol.test.ts
          tests/otlp-tracing.integration.test.ts
          tests/otlp-api-trace.integration.test.ts

      - name: One full-root test invocation on exact candidate
        id: test
        run: npm test

      - name: Full build
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: npm run build

      - name: Hygiene and immutable-source readback
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          npm run hygiene:preflight
          test "$(git rev-parse HEAD)" = '299b2261982f347147c25f378c7b1b8b05d39914'
          test -z "$(git status --porcelain)"
          git diff --check
          printf 'One exact-source full-root invocation; no added retries (stock web CI retry 2 unchanged), cache, artifact uploads, hook instrumentation, assertion weakening, or timeout increases. Historical failures and skips remain separate evidence.\n' >> "$GITHUB_STEP_SUMMARY"
