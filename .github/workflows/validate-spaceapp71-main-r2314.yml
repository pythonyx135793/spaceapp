name: SpaceApp worker tracing current-main integration R2314
on:
  push:
    branches: [codex/proof-spaceapp71-merge-r2314]
permissions:
  contents: read
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  SOURCE_HEAD: "2c329f6447ac15b3916f18a82d68d4d0471164ed"
  SOURCE_TREE: "6816f5911b0394064f0e410c3d27ec0ffcae630e"
  SOURCE_MANIFEST: "c2a65a4d0ee84ff77ff7e85514e57c597c3de6f10c0bd8a03637116624b99820"
  SOURCE_WORKER: "5151abefb1ae19ebb8ded3b3088a0f825ab91c4da26fa69d073b53409c1ed1fa"
  OLD_WORKER: "43c5420e88b705ff67c85ce39fa388ffddd07b432e73d4702468b615b9d41e39"
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: application
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2c329f6447ac15b3916f18a82d68d4d0471164ed
          path: application
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: application/.nvmrc
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Verify exact frozen application bytes and environment
        id: source
        run: |
          mkdir -p "$RUNNER_TEMP/spaceapp71-r2314"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          node --version
          npm --version
          uname -a
          cat > "$RUNNER_TEMP/spaceapp71-r2314/source-guard.py" <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd(); files=[]
          entries=subprocess.check_output(['git','ls-tree','-r','-z','HEAD']).split(b'\0')
          for entry in entries:
              if not entry: continue
              meta,name=entry.split(b'\t',1); mode,kind,oid=meta.decode().split()
              assert kind=='blob'
              name=name.decode(); path=root/name
              raw=os.readlink(path).encode() if path.is_symlink() else path.read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==oid,name
              files.append({'path':name,'mode':mode,'git_blob':oid,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          files.sort(key=lambda x:x['path'])
          digest=hashlib.sha256(json.dumps(files,sort_keys=True,separators=(',',':'),ensure_ascii=True).encode()).hexdigest()
          assert digest==os.environ['SOURCE_MANIFEST'],digest
          print(json.dumps({'source_files':len(files),'source_bytes':sum(x['bytes'] for x in files),'manifest_sha256':digest}))
          PY
          python3 "$RUNNER_TEMP/spaceapp71-r2314/source-guard.py"
      - name: Locked dependency installation
        id: install
        run: npm ci --no-audit --no-fund
      - name: Ensure real file-search test prerequisite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if ! command -v rg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; fi
          rg --version
      - name: Full repository check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check 2>&1 | tee "$RUNNER_TEMP/spaceapp71-r2314/check.log"
      - name: Negative control rejects the previous worker stream wiring
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          evidence="$RUNNER_TEMP/spaceapp71-r2314"
          cp apps/worker/src/worker.ts "$evidence/candidate-worker.ts"
          trap 'cp "$evidence/candidate-worker.ts" apps/worker/src/worker.ts' EXIT
          python3 - <<'PY'
          import hashlib,os,pathlib
          p=pathlib.Path('apps/worker/src/worker.ts'); raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ['SOURCE_WORKER']
          new=b'handle: (body, signal, emit) => runNousTurn(validateNousTurnInput(body), signal, emit)'
          old=b'handle: (body, signal) => runNousTurn(validateNousTurnInput(body), signal)'
          assert raw.count(new)==1
          raw=raw.replace(new,old)
          assert hashlib.sha256(raw).hexdigest()==os.environ['OLD_WORKER']
          p.write_bytes(raw)
          PY
          set +e
          npm test -w @space/worker -- tests/worker-tracing-lifecycle.test.ts -t "forwards streamed Nous turn events" --reporter=json --outputFile="$evidence/negative.json" > "$evidence/negative.log" 2>&1
          result=$?
          set -e
          cp "$evidence/candidate-worker.ts" apps/worker/src/worker.ts
          trap - EXIT
          cat "$evidence/negative.log"
          test "$result" -eq 1
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'spaceapp71-r2314/negative.json'
          r=json.loads(p.read_text()); assertions=[a for f in r['testResults'] for a in f['assertionResults']]
          failed=[a for a in assertions if a['status']=='failed']
          assert len(failed)==1 and 'forwards streamed Nous turn events' in failed[0]['fullName']
          assert r['numFailedTests']==1 and r['numPassedTests']==0
          assert all(a['status'] in ('failed','pending','skipped') for a in assertions)
          assert hashlib.sha256(pathlib.Path('apps/worker/src/worker.ts').read_bytes()).hexdigest()==os.environ['SOURCE_WORKER']
          print(json.dumps({'negative_control':'expected test failure confirmed','failed_test':failed[0]['fullName'],'filtered_other_tests':len(assertions)-1,'source_restored':True}))
          PY
      - name: Full repository tests including real Temporal collector and replay
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/spaceapp71-r2314/root-tests.log"
      - name: Full repository build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run build 2>&1 | tee "$RUNNER_TEMP/spaceapp71-r2314/build.log"
      - name: Hygiene and final immutable source guard
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          npm run hygiene:preflight 2>&1 | tee "$RUNNER_TEMP/spaceapp71-r2314/hygiene.log"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1)"
          python3 "$RUNNER_TEMP/spaceapp71-r2314/source-guard.py"
      - name: Summarize actual results and evidence hashes
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'spaceapp71-r2314'
          for f in sorted(p.glob('*.log')):
              raw=f.read_bytes(); text=re.sub(r'\x1b\[[0-9;]*m','',raw.decode('utf-8','replace'))
              lines=[s for s in text.splitlines() if re.search(r'Test Files|Tests\s+\d|^# (?:pass|fail|skipped|tests)|^not ok|^ FAIL |^Failed Tests|^Error:',s)]
              print(json.dumps({'file':f.name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'summary_lines':lines}))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: spaceapp71-r2314-exact-source
          path: ${{ runner.temp }}/spaceapp71-r2314
          retention-days: 14
