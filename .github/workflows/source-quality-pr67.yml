name: PR 67 immutable source quality

on:
  push:
    branches:
      - codex/source-quality-pr67-20261017
    paths:
      - .github/workflows/source-quality-pr67.yml

permissions:
  contents: read

concurrency:
  group: source-quality-pr67-20261017
  cancel-in-progress: false

jobs:
  source-quality:
    if: >-
      github.repository == 'pythonyx135793/spaceapp' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/source-quality-pr67-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out immutable PR 67 source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pythonyx135793/spaceapp
          ref: 88fd3eed2f513ca4c140df73f00c624075ff91dd
          persist-credentials: false
          fetch-depth: 1

      - name: Verify tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '88fd3eed2f513ca4c140df73f00c624075ff91dd'
          test -z "$(git status --porcelain)"
          printf 'Tested source commit: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'Workflow commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up source-required Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          # Deliberately no Actions dependency cache.

      - name: Prepare file-search test dependency
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ripgrep
          fi
          rg --version
          node --version
          npm --version

      - name: Install locked dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Check complete source repository
        id: check
        run: npm run check

      - name: Test complete source repository
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build complete source repository
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Check source hygiene
        id: hygiene
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run hygiene:preflight

      - name: Record actual command outcomes
        if: ${{ !cancelled() }}
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          HYGIENE_OUTCOME: ${{ steps.hygiene.outcome }}
        run: |
          {
            printf '\n| Command | Outcome |\n| --- | --- |\n'
            printf '| npm ci | %s |\n' "$INSTALL_OUTCOME"
            printf '| npm run check | %s |\n' "$CHECK_OUTCOME"
            printf '| npm test | %s |\n' "$TEST_OUTCOME"
            printf '| npm run build | %s |\n' "$BUILD_OUTCOME"
            printf '| npm run hygiene:preflight | %s |\n' "$HYGIENE_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

