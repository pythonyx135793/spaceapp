name: Platform matrix

on:
  pull_request:
    paths:
      - "packages/run-spaceapp/**"
      - "package-lock.json"
      - ".github/workflows/platform-matrix.yml"
      - "scripts/ci/rootless-podman.mjs"
      - "scripts/public-export.mjs"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Launcher / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.23.0"
          - os: macos-latest
            node: "22.23.0"
          - os: windows-latest
            node: "22.23.0"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspace dependencies on supported hosts
        if: runner.arch != 'ARM64'
        run: npm ci

      - name: Install source workspace for the intentional x64 package rejection test
        if: runner.arch == 'ARM64'
        run: npm ci --force

      - run: npm test -w run-spaceapp
      - run: npm run check -w run-spaceapp
      - run: npm run pack:dry-run -w run-spaceapp
      - run: node packages/run-spaceapp/bin/spaceapp.mjs --version

  podman:
    name: Rootless Podman / small / Ubuntu
    # The native source bootstrap is pinned for current Ubuntu24.04 and fails on unreviewed image drift.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-podman-${{ github.run_id }}-${{ github.run_attempt }}
      PODMAN_COMPOSE_PROVIDER: docker-compose
      SPACEAPP_CI_REPOSITORY_VISIBILITY: ${{ github.event.repository.private == false && 'public' || 'private' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
      - name: Bootstrap native Podman and verify the real small lifecycle
        id: podman-proof
        timeout-minutes: 58
        shell: bash
        run: node scripts/ci/rootless-podman.mjs
      - name: Preserve sanitized Podman terminal evidence
        if: always() && steps.podman-proof.outputs.sanitized == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootless-podman-small-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spaceapp-podman-logs/
          if-no-files-found: warn
