name: Issue63 native helper proof only

on:
  push:
    branches:
      - codex/spaceapp63-native-proof-cp395-r85-c20
    paths:
      - .github/workflows/spaceapp63-native-proof.yml

permissions:
  contents: read

jobs:
  native-small:
    if: >-
      ${{ github.repository == 'pythonyx135793/spaceapp' &&
          github.event.repository.private == false &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/codex/spaceapp63-native-proof-cp395-r85-c20' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: 274a61667eea5e1a79e8ae9368d6e74000900731
      PODMAN_COMPOSE_PROVIDER: docker-compose
      SPACEAPP_CI_REPOSITORY_VISIBILITY: ${{ github.event.repository.private == false && 'public' || 'private' }}
    steps:
      - name: Refuse an unbound source template
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" != "$CANDIDATE_SHA" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
      - name: Verify exact source and pure helper controls
        timeout-minutes: 1
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git diff --exit-code HEAD --
          [[ -z "$(git status --porcelain=v1 --untracked-files=normal)" ]]
          node --test scripts/ci/native-apt-source.test.mjs scripts/ci/native-host-prereqs.test.mjs
          python3 -I -B scripts/ci/native-apt-keyring.test.py
      - name: Bootstrap native Podman and verify the real small lifecycle
        id: podman-proof
        timeout-minutes: 58
        working-directory: candidate
        shell: bash
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-podman-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/ci/rootless-podman.mjs
      - name: Verify final source remained unchanged
        if: always()
        timeout-minutes: 1
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git diff --exit-code HEAD --
          [[ -z "$(git status --porcelain=v1 --untracked-files=normal)" ]]
      - name: Preserve sanitized native terminal evidence
        if: always() && steps.podman-proof.outputs.sanitized == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootless-podman-small-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spaceapp-podman-logs/
          if-no-files-found: warn
